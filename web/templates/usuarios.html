<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios - Protud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3">Usuarios</h1>
            <a href="{{ url_for('panel') }}" class="btn btn-outline-secondary btn-sm">Volver al panel</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped align-middle bg-white">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in usuarios %}
                    <tr>
                        <td>{{ u[1] }}</td>
                        <td>{{ u[2] }}</td>
                        <td>{{ u[3] }}</td>
                        <td>
                            {% if u[4] %}
                                <span class="badge bg-success">Activo</span>
                            {% else %}
                                <span class="badge bg-secondary">Dado de baja</span>
                            {% endif %}
                        </td>
                        <td>
                            {% if u[4] %}
                            <form method="post" action="{{ url_for('baja_usuario', id=u[0]) }}">
                                <button class="btn btn-danger btn-sm">Dar de baja</button>
                            </form>
                            {% else %}
                            <form method="post" action="{{ url_for('reactivar_usuario', id=u[0]) }}">
                                <button class="btn btn-success btn-sm">Reactivar</button>
                            </form>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
