<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control manual - Protud</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- BARRA DE ARRIBA -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo de Protud" height="40">
        Protud
      </a>
      <a href="/robot" class="btn btn-outline-light btn-sm">Volver al robot</a>
    </div>
  </nav>

  <div class="container py-5 text-center">
    <h1 class="mb-2">🕹️ Control manual</h1>
    <span class="badge bg-secondary mb-4">Próximamente</span>

    <div class="card shadow-sm mx-auto" style="max-width: 320px;">
      <div class="card-body">
        <div>
          <button class="btn btn-dark btn-lg m-1" onclick="mover('adelante')">⬆️</button>
        </div>
        <div>
          <button class="btn btn-dark btn-lg m-1" onclick="mover('izquierda')">⬅️</button>
          <button class="btn btn-danger btn-lg m-1" onclick="mover('parar')">⏹️</button>
          <button class="btn btn-dark btn-lg m-1" onclick="mover('derecha')">➡️</button>
        </div>
        <div>
          <button class="btn btn-dark btn-lg m-1" onclick="mover('atrás')">⬇️</button>
        </div>
      </div>
    </div>
  </div>

  <!-- NOTIFICACIÓN (TOAST) -->
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="aviso" class="toast text-bg-dark" role="alert">
      <div class="toast-body fs-5" id="textoAviso"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Todavía no mueve el robot: solo avisa qué botón tocaste
    function mover(direccion) {
      document.getElementById("textoAviso").textContent = "🕹️ " + direccion + " (próximamente)";
      bootstrap.Toast.getOrCreateInstance(document.getElementById("aviso")).show();
    }
  </script>
</body>
</html>
