<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotos - Protud</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- BARRA DE ARRIBA -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo de Protud" height="40">
        Protud
      </a>
      <a href="/robot" class="btn btn-outline-light btn-sm">Volver al robot</a>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="mb-4">📷 Fotos</h1>

    <div class="row g-4">

      <!-- Una tarjeta por cada foto que manda Flask -->
      {% for foto in fotos %}
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm h-100">
          <img src="{{ url_for('static', filename=foto.archivo) }}"
               alt="{{ foto.motivo }}"
               title="Imagen conceptual · Fotos reales próximamente"
               class="card-img-top">
          <div class="card-body">
            <h5 class="card-title">{{ foto.motivo }}</h5>
            <p class="text-secondary mb-0">{{ foto.fecha }}</p>
          </div>
        </div>
      </div>
      {% endfor %}

    </div>
  </div>

</body>
</html>
